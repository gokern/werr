version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gci
    - golines
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        # An explicit prefix rather than localmodule: run from the root,
        # localmodule treats github.com/gokern/werr/v2 as this module's own,
        # but run inside interop/sentry — a module of its own — the same
        # import is third-party, and the two runs rewrite each other's import
        # blocks. Named outright, both runs agree.
        - prefix(github.com/gokern/werr)
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"


linters:
  default: all
  disable:
    - wsl # Deprecated, replaced by wsl_v5.
    - gomodguard # Deprecated, replaced by gomodguard_v2.
    - exhaustruct # Deprecated, replaced by exhaustruct_v5.
    - err113
    # White-box tests are intentional (see CLAUDE.md "Test layout"): black-box
    # tests live in *_test.go with package werr_test, white-box tests share the
    # package to exercise unexported helpers.
    - testpackage
    # Many tests deliberately mutate global state (formatter, allocation
    # baselines, PC capture) and cannot be run in parallel safely.
    - paralleltest
  settings:
    depguard:
      rules:
        # The root module; interop/sentry has a rule of its own below.
        main:
          files:
            - "!**/interop/sentry/**"
          allow:
            - $gostd
            - github.com/gokern/panics # the module's only dependency
            - github.com/gokern/werr/v2
            - github.com/stretchr/testify
        # interop/sentry is a module of its own that exists to run the
        # sentry-go integration tests; its dependencies never reach the root
        # go.mod. The root .golangci.yaml still governs it, because
        # golangci-lint finds the config by searching upwards.
        sentry:
          files:
            - "**/interop/sentry/**"
          allow:
            - $gostd
            - github.com/getsentry/sentry-go # the module exists to test against it
            - github.com/gokern/panics # the shared recovered-panic type, for the panic-path tests
            - github.com/gokern/werr/v2 # the module under test, via the local replace
            - github.com/stretchr/testify # assertions, test-only
    dogsled:
      # runtime.Caller returns four values; tests legitimately discard three.
      max-blank-identifiers: 3
    lll:
      # Default 120 is too tight for godoc example lines (which cannot be wrapped
      # without breaking the rendered docs).
      line-length: 130
    varnamelen:
      ignore-names:
        - fn
        - v
        - tc # test case
        - i
        - n  # length / count
        - a  # arena, attr
        - h  # handler
        - p  # pointer
        - p1
        - p2
      ignore-decls:
        - wg sync.WaitGroup
        - w werr.Error
        - w *werr.Error
        - mu sync.Mutex
        - sb *strings.Builder
        - sb strings.Builder
        - we Error
        - we *Error
        - a arena.box
        - f werr.Frame
        - f Frame
        - f sentry.Frame
        - st *sentry.Stacktrace
  exclusions:
    rules:
      # The nested module has to build against the working tree, or a change
      # here could not be compiled with the root change it depends on.
      # Consumers ignore a dependency's replace directives, so it costs an
      # importer nothing.
      - path: interop/sentry/
        linters:
          - gomoddirectives
        text: "local replacement"

      - path: _test\.go
        linters:
          - exhaustruct_v5
          - funlen          # table-driven tests legitimately grow large
          - forcetypeassert # tests know the concrete shape they constructed
          - gosec           # G602 etc. — tests deliberately panic / index OOB
