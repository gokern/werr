name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    # One entry per module: golangci-lint stops at a module boundary, so a run
    # at the root never opens interop/sentry. Both entries are held to one
    # policy anyway, because golangci-lint finds the root .golangci.yaml by
    # searching upwards from the module directory.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "interop/sentry"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned deliberately: `latest` makes every upstream golangci-lint
          # release able to turn CI red on an untouched tree (a new check, or a
          # linter deprecation under `default: all`). Bump this on purpose,
          # together with any config/code changes the new version demands.
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "benchmark", "interop/sentry"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
