name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    # One entry per module: golangci-lint stops at a module boundary, so a run
    # at the root never opens interop/sentry. Both entries are held to one
    # policy anyway, because golangci-lint finds the root .golangci.yaml by
    # searching upwards from the module directory.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "interop/sentry"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned in mise.toml [tools] — the same install CI and `mise run
          # lint` use locally. Bump it there, on purpose, together with any
          # config/code changes the new version demands.
          install-mode: none
          working-directory: ${{ matrix.module }}

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    # All three modules, through the mise task that loops them: an untidy
    # nested one is invisible from the root, because go mod tidy does not
    # cross a module boundary either.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand

      - name: Check every go.mod is tidy
        run: mise run tidy
